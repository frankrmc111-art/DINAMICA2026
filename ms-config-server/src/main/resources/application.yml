server:
  port: 7070

spring:
  application:
    name: config-server
  security:
    user:
      name: root
      password: 123456
  cloud:
    config:
      server:
        git:
          uri: https://github.com/noetipo/UNAJIngSoftware.git
          searchPaths: config-data
          default-label: main
          # Si el repositorio es privado, descomentar y usar un token de GitHub:
          # username: TU_USUARIO
          # password: TU_TOKEN
